appId: com.inventario.escritorio
productName: Inventario Escritorio
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
